<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b0f14" />
<title>Home Dashboard</title>
<style>
  :root{
    --bg:#0b0f14;
    --panel:#121922;
    --panel2:#0f151d;
    --text:#f4f7fb;
    --muted:#8f9baa;
    --line:#26303b;
    --accent:#69b7ff;
    --good:#8bd49c;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;width:100%;height:100%;
    overflow:hidden;
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic UI","Hiragino Sans",sans-serif;
  }
  body{
    padding:10px;
    min-height:100vh;
    min-height:100dvh;
  }
  .app{
    width:100%;height:100%;
    display:grid;
    grid-template-rows:minmax(0,18fr) minmax(0,82fr);
    gap:12px;
  }
  .card{
    min-height:0;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.16);
  }

  /* Header */
  .header{
    padding:12px 18px;
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:16px;
  }
  .header-date{
    font-size:18px;
    color:#c6d0db;
    margin-bottom:2px;
  }
  .header-weekday{
    font-size:14px;
    color:var(--muted);
  }
  .header-time{
    font-size:56px;
    line-height:1;
    font-weight:700;
    letter-spacing:.045em;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .header-time .sec{
    font-size:.46em;
    color:var(--muted);
    font-weight:500;
  }

  /* Main 2 columns */
  .main{
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,54fr) minmax(0,46fr);
    gap:12px;
  }
  .left,.right{
    min-height:0;
    display:grid;
    gap:12px;
  }
  .left{grid-template-rows:minmax(0,64fr) minmax(0,36fr)}
  .right{grid-template-rows:minmax(0,50fr) minmax(0,50fr)}

  .section{
    padding:13px 15px;
    min-height:0;
  }
  .section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-size:17px;
    font-weight:750;
    margin-bottom:8px;
  }
  .section-title small{
    font-size:11px;color:var(--muted);font-weight:500;
  }
  button{
    background:#19232e;
    border:1px solid #344252;
    color:#dce6ef;
    border-radius:9px;
    padding:5px 9px;
    font-size:11px;
  }

  /* Calendar */
  .calendar-card{padding:12px 15px 10px}
  .month-title{
    font-size:19px;
    font-weight:750;
    margin:0 0 7px 2px;
  }
  table{
    width:100%;
    height:calc(100% - 34px);
    border-collapse:separate;
    border-spacing:2px 1px;
    table-layout:fixed;
  }
  th{
    font-size:11px;
    color:var(--muted);
    font-weight:650;
    height:20px;
  }
  td{
    text-align:center;
    font-size:13px;
    color:#d7dee6;
    border-radius:7px;
    height:27px;
  }
  td.sun,th.sun{color:#ff9696}
  td.sat,th.sat{color:#84bfff}
  td.today{
    background:#dfe9f3;
    color:#10151b;
    font-weight:850;
  }

  /* Weather */
  .weather-card{
    padding:12px 15px;
    display:grid;
    grid-template-rows:auto 1fr;
  }
  .weather-main{
    min-height:0;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:14px;
  }
  .wx-icon{
    font-size:45px;
    width:52px;
    text-align:center;
  }
  .weather-temp{
    font-size:45px;
    font-weight:750;
    line-height:1;
  }
  .weather-condition{
    font-size:14px;
    color:#d9e1e9;
    margin-top:5px;
  }
  .weather-stats{
    display:grid;
    gap:5px;
    min-width:142px;
  }
  .weather-stat{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    padding:5px 8px;
    border-radius:9px;
    background:#0c1219;
    border:1px solid #222c36;
  }
  .weather-stat span:first-child{color:var(--muted)}
  .weather-stat strong{font-weight:750}

  /* Lists */
  .list{
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .item{
    min-height:0;
    display:grid;
    grid-template-columns:56px 1fr;
    gap:9px;
    align-items:center;
    padding:7px 9px;
    border-radius:10px;
    background:#0c1219;
    border:1px solid #222c36;
  }
  .item .when{
    font-size:12px;
    font-weight:800;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .item .what{
    font-size:13px;
    line-height:1.25;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .item .sub{
    display:none;
  }
  .tasks .item{
    grid-template-columns:20px 1fr;
  }
  .check{
    width:14px;height:14px;
    border-radius:50%;
    border:2px solid #657382;
  }
  .done .check{
    border-color:var(--good);
    background:var(--good);
    box-shadow:inset 0 0 0 3px #0c1219;
  }
  .done .what{
    text-decoration:line-through;
    color:#788491;
  }
  .more{
    font-size:11px;
    color:var(--muted);
    text-align:right;
    padding:2px 2px 0;
  }
  .empty{
    height:100%;
    display:grid;
    place-items:center;
    color:var(--muted);
    font-size:13px;
  }

  /* Editor */
  .modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal.show{display:flex}
  .editor{
    width:min(700px,94vw);
    background:#101720;
    border:1px solid #33404c;
    border-radius:18px;
    padding:16px;
  }
  .editor h3{margin:0 0 10px}
  textarea{
    width:100%;
    height:240px;
    background:#090e13;
    color:#eef3f8;
    border:1px solid #2c3742;
    border-radius:12px;
    padding:11px;
    font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
    resize:none;
  }
  .editor-actions{
    display:flex;
    justify-content:flex-end;
    gap:9px;
    margin-top:10px;
  }

  @media (max-width:900px){
    .header-time{font-size:48px}
    .section{padding:11px 12px}
    .calendar-card{padding:10px 12px 8px}
    .wx-icon{font-size:39px;width:46px}
    .weather-temp{font-size:39px}
  }

  /* News / memo */
  .news-list{
    min-height:0;
    display:grid;
    grid-template-rows:repeat(4,minmax(0,1fr));
    gap:6px;
  }
  .news-item{
    min-height:0;
    display:flex;
    align-items:center;
    padding:7px 9px;
    border-radius:10px;
    background:#0c1219;
    border:1px solid #222c36;
  }
  .news-title{
    font-size:12.5px;
    line-height:1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .news-empty{
    height:100%;
    display:grid;
    place-items:center;
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:16px;
  }
  .memo-body{
    height:calc(100% - 32px);
    overflow:hidden;
    white-space:pre-wrap;
    word-break:break-word;
    font-size:14px;
    line-height:1.55;
    color:#e7edf4;
    padding:3px 2px;
  }
  .memo-body.empty{
    color:var(--muted);
  }

</style>
</head>
<body>
<div class="app">
  <header class="card header">
    <div>
      <div class="header-date" id="date"></div>
      <div class="header-weekday" id="weekday"></div>
    </div>
    <div class="header-time">
      <span id="hhmm"></span><span class="sec" id="ss"></span>
    </div>
  </header>

  <main class="main">
    <section class="left">
      <div class="card calendar-card" id="calendar"></div>

      <div class="card weather-card">
        <div class="section-title">
          <span>大阪の天気</span>
          <small id="weather-updated">取得中…</small>
        </div>
        <div class="weather-main">
          <div class="wx-icon" id="wx-icon">—</div>
          <div>
            <div class="weather-temp" id="temp">--°</div>
            <div class="weather-condition" id="condition">天気を取得しています</div>
          </div>
          <div class="weather-stats">
            <div class="weather-stat"><span>最高</span><strong id="tmax">--°</strong></div>
            <div class="weather-stat"><span>最低</span><strong id="tmin">--°</strong></div>
            <div class="weather-stat"><span>降水</span><strong id="rain">--%</strong></div>
          </div>
        </div>
      </div>
    </section>

    <section class="right">
      <div class="card section news-card">
        <div class="section-title">
          <span>ニュース</span>
          <button onclick="loadNews(true)">更新</button>
        </div>
        <div class="news-list" id="news"></div>
      </div>

      <div class="card section memo-card">
        <div class="section-title">
          <span>メモ</span>
          <button onclick="openMemoEditor()">編集</button>
        </div>
        <div class="memo-body" id="memo"></div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="editor">
    <h3>メモを編集</h3>
    <textarea id="editorText" placeholder="ここにメモを書いてください"></textarea>
    <div class="editor-actions">
      <button onclick="closeMemoEditor()">キャンセル</button>
      <button onclick="saveMemo()">保存</button>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  latitude: 34.6937,
  longitude: 135.5023
};

const MAX_SCHEDULE = 4;
const MAX_TASKS = 4;
let editing = null;

function pad(n){ return String(n).padStart(2,'0'); }

function updateClock(){
  const n = new Date();
  const days = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
  document.getElementById('date').textContent =
    `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`;
  document.getElementById('weekday').textContent = days[n.getDay()];
  document.getElementById('hhmm').textContent =
    `${pad(n.getHours())}:${pad(n.getMinutes())}`;
  document.getElementById('ss').textContent = `:${pad(n.getSeconds())}`;
}

function monthTable(date){
  const y = date.getFullYear(), m = date.getMonth();
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const today = new Date();

  let html = `<div class="month-title">${y}年 ${m+1}月</div>
  <table><thead><tr>
    <th class="sun">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th class="sat">土</th>
  </tr></thead><tbody>`;

  let d=1, started=false;
  for(let r=0;r<6;r++){
    html += '<tr>';
    for(let c=0;c<7;c++){
      if(!started && r===0 && c===first.getDay()) started=true;
      if(started && d<=last.getDate()){
        const isToday =
          y===today.getFullYear() &&
          m===today.getMonth() &&
          d===today.getDate();
        const cls = [
          c===0?'sun':'',
          c===6?'sat':'',
          isToday?'today':''
        ].join(' ');
        html += `<td class="${cls}">${d}</td>`;
        d++;
      } else {
        html += '<td></td>';
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

function renderCalendar(){
  document.getElementById('calendar').innerHTML = monthTable(new Date());
}

const WMO = {
  0:["☀️","快晴"],1:["🌤️","晴れ"],2:["⛅","晴れ時々くもり"],3:["☁️","くもり"],
  45:["🌫️","霧"],48:["🌫️","霧"],
  51:["🌦️","弱い霧雨"],53:["🌦️","霧雨"],55:["🌧️","強い霧雨"],
  61:["🌦️","弱い雨"],63:["🌧️","雨"],65:["🌧️","強い雨"],
  71:["🌨️","弱い雪"],73:["🌨️","雪"],75:["❄️","強い雪"],
  80:["🌦️","にわか雨"],81:["🌧️","にわか雨"],82:["⛈️","激しいにわか雨"],
  95:["⛈️","雷雨"],96:["⛈️","雷雨"],99:["⛈️","激しい雷雨"]
};
function wx(code){ return WMO[code] || ["🌡️","天気"]; }

async function loadWeather(){
  try{
    const u =
      `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}` +
      `&current=temperature_2m,weather_code` +
      `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
      `&timezone=Asia%2FTokyo&forecast_days=1`;

    const r = await fetch(u);
    const j = await r.json();

    const [icon,label] = wx(j.current.weather_code);
    document.getElementById('wx-icon').textContent = icon;
    document.getElementById('temp').textContent =
      `${Math.round(j.current.temperature_2m)}°`;
    document.getElementById('condition').textContent = label;
    document.getElementById('tmax').textContent =
      `${Math.round(j.daily.temperature_2m_max[0])}°`;
    document.getElementById('tmin').textContent =
      `${Math.round(j.daily.temperature_2m_min[0])}°`;
    document.getElementById('rain').textContent =
      `${j.daily.precipitation_probability_max[0] ?? '-'}%`;

    const n = new Date();
    document.getElementById('weather-updated').textContent =
      `${pad(n.getHours())}:${pad(n.getMinutes())} 更新`;
  }catch(e){
    document.getElementById('condition').textContent = '天気を取得できません';
    document.getElementById('weather-updated').textContent = 'オフライン';
  }
}

const NEWS_RSS =
  'https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja';
const NEWS_PROXY =
  'https://api.rss2json.com/v1/api.json?rss_url=';

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function cleanNewsTitle(title){
  const s = String(title || '').trim();
  // Google News usually appends " - source". Keep the headline itself.
  const parts = s.split(' - ');
  return parts.length > 1 ? parts.slice(0,-1).join(' - ') : s;
}

async function loadNews(manual=false){
  const el = document.getElementById('news');
  if(manual || !el.children.length){
    el.innerHTML = '<div class="news-empty">ニュースを取得しています…</div>';
  }

  try{
    const url = NEWS_PROXY + encodeURIComponent(NEWS_RSS);
    const r = await fetch(url, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();

    const items = Array.isArray(j.items) ? j.items.slice(0,4) : [];
    if(!items.length) throw new Error('No news');

    el.innerHTML = items.map(item => `
      <div class="news-item">
        <div class="news-title">${escapeHtml(cleanNewsTitle(item.title))}</div>
      </div>
    `).join('');

    localStorage.setItem('dash_news_cache', JSON.stringify({
      savedAt: Date.now(),
      items: items.map(x => ({title: cleanNewsTitle(x.title)}))
    }));
  }catch(e){
    try{
      const cache = JSON.parse(localStorage.getItem('dash_news_cache') || 'null');
      if(cache && Array.isArray(cache.items) && cache.items.length){
        el.innerHTML = cache.items.slice(0,4).map(item => `
          <div class="news-item">
            <div class="news-title">${escapeHtml(item.title)}</div>
          </div>
        `).join('');
        return;
      }
    }catch(_){}

    el.innerHTML = '<div class="news-empty">ニュースを取得できませんでした</div>';
  }
}

function renderMemo(){
  const el = document.getElementById('memo');
  const text = localStorage.getItem('dash_memo') || '';
  if(text.trim()){
    el.textContent = text;
    el.classList.remove('empty');
  }else{
    el.textContent = 'メモはまだありません';
    el.classList.add('empty');
  }
}

function openMemoEditor(){
  document.getElementById('editorText').value =
    localStorage.getItem('dash_memo') || '';
  document.getElementById('modal').classList.add('show');
}

function closeMemoEditor(){
  document.getElementById('modal').classList.remove('show');
}

function saveMemo(){
  localStorage.setItem(
    'dash_memo',
    document.getElementById('editorText').value
  );
  renderMemo();
  closeMemoEditor();
}

updateClock();
setInterval(updateClock,1000);
renderCalendar();
setInterval(renderCalendar,60*60*1000);
renderMemo();
loadNews();
loadWeather();

setInterval(loadNews,15*60*1000);
setInterval(loadWeather,15*60*1000);

document.addEventListener('visibilitychange', () => {
  if(!document.hidden){
    loadNews();
    loadWeather();
  }
});
</script>
</body>
</html>
