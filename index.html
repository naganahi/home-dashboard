<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b0f14" />
<title>Home Dashboard</title>
<style>
  :root{
    --bg:#0b0f14;
    --panel:#121922;
    --panel2:#0f151d;
    --text:#f4f7fb;
    --muted:#8f9baa;
    --line:#26303b;
    --accent:#69b7ff;
    --good:#8bd49c;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;width:100%;height:100%;
    overflow:hidden;
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic UI","Hiragino Sans",sans-serif;
  }
  body{
    padding:10px;
    min-height:100vh;
    min-height:100dvh;
  }
  .app{
    width:100%;height:100%;
    display:grid;
    grid-template-rows:minmax(0,18fr) minmax(0,82fr);
    gap:12px;
  }
  .card{
    min-height:0;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.16);
  }

  /* Header */
  .header{
    padding:12px 18px;
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:16px;
  }
  .header-date{
    font-size:18px;
    color:#c6d0db;
    margin-bottom:2px;
  }
  .header-weekday{
    font-size:14px;
    color:var(--muted);
  }
  .header-time{
    font-size:56px;
    line-height:1;
    font-weight:700;
    letter-spacing:.045em;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .header-time .sec{
    font-size:.46em;
    color:var(--muted);
    font-weight:500;
  }

  /* Main 2 columns */
  .main{
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,54fr) minmax(0,46fr);
    gap:12px;
  }
  .left,.right{
    min-height:0;
    display:grid;
    gap:12px;
  }
  .left{grid-template-rows:minmax(0,64fr) minmax(0,36fr)}
  .right{grid-template-rows:minmax(0,50fr) minmax(0,50fr)}

  .section{
    padding:13px 15px;
    min-height:0;
  }
  .section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-size:17px;
    font-weight:750;
    margin-bottom:8px;
  }
  .section-title small{
    font-size:11px;color:var(--muted);font-weight:500;
  }
  button{
    background:#19232e;
    border:1px solid #344252;
    color:#dce6ef;
    border-radius:9px;
    padding:5px 9px;
    font-size:11px;
  }

  /* Calendar */
  .calendar-card{padding:12px 15px 10px}
  .month-title{
    font-size:19px;
    font-weight:750;
    margin:0 0 7px 2px;
  }
  table{
    width:100%;
    height:calc(100% - 34px);
    border-collapse:separate;
    border-spacing:2px 1px;
    table-layout:fixed;
  }
  th{
    font-size:11px;
    color:var(--muted);
    font-weight:650;
    height:20px;
  }
  td{
    text-align:center;
    font-size:13px;
    color:#d7dee6;
    border-radius:7px;
    height:27px;
  }
  td.sun,th.sun{color:#ff9696}
  td.sat,th.sat{color:#84bfff}
  td.today{
    background:#dfe9f3;
    color:#10151b;
    font-weight:850;
  }

  /* Weather */
  .weather-card{
    padding:12px 15px;
    display:grid;
    grid-template-rows:auto 1fr;
  }
  .weather-main{
    min-height:0;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:14px;
  }
  .wx-icon{
    font-size:45px;
    width:52px;
    text-align:center;
  }
  .weather-temp{
    font-size:45px;
    font-weight:750;
    line-height:1;
  }
  .weather-condition{
    font-size:14px;
    color:#d9e1e9;
    margin-top:5px;
  }
  .weather-stats{
    display:grid;
    gap:5px;
    min-width:142px;
  }
  .weather-stat{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    padding:5px 8px;
    border-radius:9px;
    background:#0c1219;
    border:1px solid #222c36;
  }
  .weather-stat span:first-child{color:var(--muted)}
  .weather-stat strong{font-weight:750}

  /* Lists */
  .list{
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .item{
    min-height:0;
    display:grid;
    grid-template-columns:56px 1fr;
    gap:9px;
    align-items:center;
    padding:7px 9px;
    border-radius:10px;
    background:#0c1219;
    border:1px solid #222c36;
  }
  .item .when{
    font-size:12px;
    font-weight:800;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .item .what{
    font-size:13px;
    line-height:1.25;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .item .sub{
    display:none;
  }
  .tasks .item{
    grid-template-columns:20px 1fr;
  }
  .check{
    width:14px;height:14px;
    border-radius:50%;
    border:2px solid #657382;
  }
  .done .check{
    border-color:var(--good);
    background:var(--good);
    box-shadow:inset 0 0 0 3px #0c1219;
  }
  .done .what{
    text-decoration:line-through;
    color:#788491;
  }
  .more{
    font-size:11px;
    color:var(--muted);
    text-align:right;
    padding:2px 2px 0;
  }
  .empty{
    height:100%;
    display:grid;
    place-items:center;
    color:var(--muted);
    font-size:13px;
  }

  /* Editor */
  .modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal.show{display:flex}
  .editor{
    width:min(700px,94vw);
    background:#101720;
    border:1px solid #33404c;
    border-radius:18px;
    padding:16px;
  }
  .editor h3{margin:0 0 10px}
  textarea{
    width:100%;
    height:240px;
    background:#090e13;
    color:#eef3f8;
    border:1px solid #2c3742;
    border-radius:12px;
    padding:11px;
    font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
    resize:none;
  }
  .editor-actions{
    display:flex;
    justify-content:flex-end;
    gap:9px;
    margin-top:10px;
  }

  @media (max-width:900px){
    .header-time{font-size:48px}
    .section{padding:11px 12px}
    .calendar-card{padding:10px 12px 8px}
    .wx-icon{font-size:39px;width:46px}
    .weather-temp{font-size:39px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="card header">
    <div>
      <div class="header-date" id="date"></div>
      <div class="header-weekday" id="weekday"></div>
    </div>
    <div class="header-time">
      <span id="hhmm"></span><span class="sec" id="ss"></span>
    </div>
  </header>

  <main class="main">
    <section class="left">
      <div class="card calendar-card" id="calendar"></div>

      <div class="card weather-card">
        <div class="section-title">
          <span>大阪の天気</span>
          <small id="weather-updated">取得中…</small>
        </div>
        <div class="weather-main">
          <div class="wx-icon" id="wx-icon">—</div>
          <div>
            <div class="weather-temp" id="temp">--°</div>
            <div class="weather-condition" id="condition">天気を取得しています</div>
          </div>
          <div class="weather-stats">
            <div class="weather-stat"><span>最高</span><strong id="tmax">--°</strong></div>
            <div class="weather-stat"><span>最低</span><strong id="tmin">--°</strong></div>
            <div class="weather-stat"><span>降水</span><strong id="rain">--%</strong></div>
          </div>
        </div>
      </div>
    </section>

    <section class="right">
      <div class="card section">
        <div class="section-title">
          <span>今日の予定</span>
          <button onclick="openEditor('schedule')">編集</button>
        </div>
        <div class="list" id="schedule"></div>
      </div>

      <div class="card section tasks">
        <div class="section-title">
          <span>今日の学習</span>
          <button onclick="openEditor('tasks')">編集</button>
        </div>
        <div class="list" id="tasks"></div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="editor">
    <h3 id="editorTitle">編集</h3>
    <textarea id="editorText"></textarea>
    <div class="editor-actions">
      <button onclick="closeEditor()">キャンセル</button>
      <button onclick="saveEditor()">保存</button>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  latitude: 34.6937,
  longitude: 135.5023
};

const MAX_SCHEDULE = 4;
const MAX_TASKS = 4;
let editing = null;

function pad(n){ return String(n).padStart(2,'0'); }

function updateClock(){
  const n = new Date();
  const days = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
  document.getElementById('date').textContent =
    `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`;
  document.getElementById('weekday').textContent = days[n.getDay()];
  document.getElementById('hhmm').textContent =
    `${pad(n.getHours())}:${pad(n.getMinutes())}`;
  document.getElementById('ss').textContent = `:${pad(n.getSeconds())}`;
}

function monthTable(date){
  const y = date.getFullYear(), m = date.getMonth();
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const today = new Date();

  let html = `<div class="month-title">${y}年 ${m+1}月</div>
  <table><thead><tr>
    <th class="sun">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th class="sat">土</th>
  </tr></thead><tbody>`;

  let d=1, started=false;
  for(let r=0;r<6;r++){
    html += '<tr>';
    for(let c=0;c<7;c++){
      if(!started && r===0 && c===first.getDay()) started=true;
      if(started && d<=last.getDate()){
        const isToday =
          y===today.getFullYear() &&
          m===today.getMonth() &&
          d===today.getDate();
        const cls = [
          c===0?'sun':'',
          c===6?'sat':'',
          isToday?'today':''
        ].join(' ');
        html += `<td class="${cls}">${d}</td>`;
        d++;
      } else {
        html += '<td></td>';
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

function renderCalendar(){
  document.getElementById('calendar').innerHTML = monthTable(new Date());
}

const WMO = {
  0:["☀️","快晴"],1:["🌤️","晴れ"],2:["⛅","晴れ時々くもり"],3:["☁️","くもり"],
  45:["🌫️","霧"],48:["🌫️","霧"],
  51:["🌦️","弱い霧雨"],53:["🌦️","霧雨"],55:["🌧️","強い霧雨"],
  61:["🌦️","弱い雨"],63:["🌧️","雨"],65:["🌧️","強い雨"],
  71:["🌨️","弱い雪"],73:["🌨️","雪"],75:["❄️","強い雪"],
  80:["🌦️","にわか雨"],81:["🌧️","にわか雨"],82:["⛈️","激しいにわか雨"],
  95:["⛈️","雷雨"],96:["⛈️","雷雨"],99:["⛈️","激しい雷雨"]
};
function wx(code){ return WMO[code] || ["🌡️","天気"]; }

async function loadWeather(){
  try{
    const u =
      `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}` +
      `&current=temperature_2m,weather_code` +
      `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
      `&timezone=Asia%2FTokyo&forecast_days=1`;

    const r = await fetch(u);
    const j = await r.json();

    const [icon,label] = wx(j.current.weather_code);
    document.getElementById('wx-icon').textContent = icon;
    document.getElementById('temp').textContent =
      `${Math.round(j.current.temperature_2m)}°`;
    document.getElementById('condition').textContent = label;
    document.getElementById('tmax').textContent =
      `${Math.round(j.daily.temperature_2m_max[0])}°`;
    document.getElementById('tmin').textContent =
      `${Math.round(j.daily.temperature_2m_min[0])}°`;
    document.getElementById('rain').textContent =
      `${j.daily.precipitation_probability_max[0] ?? '-'}%`;

    const n = new Date();
    document.getElementById('weather-updated').textContent =
      `${pad(n.getHours())}:${pad(n.getMinutes())} 更新`;
  }catch(e){
    document.getElementById('condition').textContent = '天気を取得できません';
    document.getElementById('weather-updated').textContent = 'オフライン';
  }
}

const defaults = {
  schedule:
`10:20|大学・授業|
16:40|授業終了|
18:00|自由時間|`,
  tasks:
`0|今日のメイン教材を進める
0|英語のハノン
0|Anki
0|英語論文を読む`
};

function getData(k){
  return localStorage.getItem('dash_'+k) ?? defaults[k];
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function renderSchedule(){
  const el = document.getElementById('schedule');
  const lines = getData('schedule').split('\n').filter(x=>x.trim());
  if(!lines.length){
    el.innerHTML = '<div class="empty">予定はありません</div>';
    return;
  }
  const shown = lines.slice(0,MAX_SCHEDULE);
  el.innerHTML = shown.map(line=>{
    const [time,what=''] = line.split('|');
    return `<div class="item">
      <div class="when">${escapeHtml(time)}</div>
      <div class="what">${escapeHtml(what)}</div>
    </div>`;
  }).join('') +
  (lines.length>MAX_SCHEDULE
    ? `<div class="more">ほか ${lines.length-MAX_SCHEDULE} 件</div>`
    : '');
}

function renderTasks(){
  const el = document.getElementById('tasks');
  const lines = getData('tasks').split('\n').filter(x=>x.trim());
  if(!lines.length){
    el.innerHTML = '<div class="empty">学習タスクはありません</div>';
    return;
  }
  const shown = lines.slice(0,MAX_TASKS);
  el.innerHTML = shown.map((line,i)=>{
    const p = line.split('|');
    const done = p.shift()==='1';
    const text = p.join('|');
    return `<div class="item ${done?'done':''}" onclick="toggleTask(${i})">
      <div class="check"></div>
      <div class="what">${escapeHtml(text)}</div>
    </div>`;
  }).join('') +
  (lines.length>MAX_TASKS
    ? `<div class="more">ほか ${lines.length-MAX_TASKS} 件</div>`
    : '');
}

function toggleTask(index){
  let lines = getData('tasks').split('\n').filter(x=>x.trim());
  let p = lines[index].split('|');
  p[0] = p[0]==='1' ? '0' : '1';
  lines[index] = p.join('|');
  localStorage.setItem('dash_tasks',lines.join('\n'));
  renderTasks();
}

function openEditor(k){
  editing = k;
  document.getElementById('editorTitle').textContent =
    k==='schedule' ? '今日の予定を編集' : '今日の学習を編集';
  document.getElementById('editorText').value = getData(k);
  document.getElementById('modal').classList.add('show');
}
function closeEditor(){
  document.getElementById('modal').classList.remove('show');
  editing = null;
}
function saveEditor(){
  if(!editing) return;
  localStorage.setItem('dash_'+editing,document.getElementById('editorText').value);
  editing==='schedule' ? renderSchedule() : renderTasks();
  closeEditor();
}

updateClock();
setInterval(updateClock,1000);
renderCalendar();
setInterval(renderCalendar,60*60*1000);
renderSchedule();
renderTasks();
loadWeather();
setInterval(loadWeather,15*60*1000);
</script>
</body>
</html>
